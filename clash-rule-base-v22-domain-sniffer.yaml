# clash-rule-base-v22-domain-sniffer.yaml
# 目的：解决连接页 host="" / sniffHost="" / dnsMode=normal，全是 IP，导致 DOMAIN 规则不命中的问题。
# 用法：上传到 GitHub/Gist/可直链位置，拿 Raw 链接，然后在 subconverter ini 里加：
# clash_rule_base=你的Raw链接

port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: off

profile:
  store-selected: true
  store-fake-ip: true

# 关键 1：嗅探域名。
# 你的连接里 host=""、sniffHost=""，说明这里没有生效。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.fqnovel.com"
    - "+.fqnovelpic.com"
    - "+.fqnovelstatic.com"
    - "+.fqnovelvod.com"
    - "+.zijieapi.com"
    - "+.snssdk.com"
    - "+.amemv.com"
    - "+.toutiaoapi.com"
    - "+.toutiao.com"
    - "+.pangolin-sdk-toutiao.com"
    - "+.pangolin-sdk-toutiao-b.com"
    - "+.pglstatp-toutiao.com"
    - "+.ctobsnssdk.com"
    - "+.douyinpic.com"
  skip-domain:
    - "+.lan"
    - "+.local"

# 关键 2：TUN 劫持 DNS。
# 不劫持 DNS 的情况下，App/系统可能先解析成真实 IP，Clash 只能看到 destinationIP。
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53

# 关键 3：必须明确 enhanced-mode: fake-ip。
# 你现在的配置只有 fake-ip-range，没有 enhanced-mode，所以日志里 dnsMode 还是 normal。
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "localhost"
    - "localhost.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "stun.*.*"
    - "stun.*.*.*"
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn":
      - 119.29.29.29
      - 223.5.5.5
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

proxies: []
proxy-groups: []
rules: []
